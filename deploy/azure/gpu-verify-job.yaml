apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-verify
  namespace: default
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      hostPID: true
      nodeSelector:
        kubernetes.azure.com/agentpool: gpuh100
      tolerations:
        - operator: Exists
      containers:
        - name: verify
          image: ubuntu:24.04
          securityContext:
            privileged: true
          command: ["nsenter", "--target", "1", "--mount", "--uts", "--ipc", "--net", "--pid", "--"]
          args:
            - bash
            - -c
            - |
              set -x
              echo "--- dmesg before nvidia-smi (last 5) ---"; dmesg | tail -5
              echo "--- running nvidia-smi -q ---"; nvidia-smi -q 2>&1 | head -40
              echo "--- dmesg AFTER nvidia-smi attempt (new lines) ---"; dmesg | tail -25
