# permissions for end users to view runtimesecuritypolicies.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: runtimesecuritypolicy-viewer-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: runtime-guard-operator
    app.kubernetes.io/part-of: runtime-guard-operator
    app.kubernetes.io/managed-by: kustomize
  name: runtimesecuritypolicy-viewer-role
rules:
- apiGroups:
  - aiops.imperium.io
  resources:
  - runtimesecuritypolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - aiops.imperium.io
  resources:
  - runtimesecuritypolicies/status
  verbs:
  - get
